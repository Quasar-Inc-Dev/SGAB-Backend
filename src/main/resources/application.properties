

spring.application.name=SGAB

spring.docker.compose.enabled=false

# Banco: Supabase (Postgres) quando DB_URL, DB_USERNAME e DB_PASSWORD estiverem definidos
# no secrets.properties ou como variáveis de ambiente (Docker: .env).
# Sem elas, cai no H2 em memória. O driver é escolhido automaticamente pela URL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:sgab;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# O plano gratuito do Supabase tem poucas conexões; cada backend rodando abre no máximo 3
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# A conexão com o banco é liberada no fim do método do service, e não só depois de o JSON ser escrito.
# Com o pool de 3 conexões isso importa. Todo acesso a relacionamento LAZY precisa estar dentro de um @Transactional.
spring.jpa.open-in-view=false
# Rede de segurança contra N+1: relacionamentos LAZY de várias entidades são carregados em lotes de até 50 por consulta
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Paginação: JSON estável {"content": [...], "page": {"size", "number", "totalElements", "totalPages"}}
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

spring.config.import=optional:file:./secrets.properties
spring.jpa.defer-datasource-initialization=true

# spring.mail.host=127.0.0.1
# spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Capas dos livros: bucket público "capas" do Supabase Storage.
# sgab.supabase.url (https://<id-do-projeto>.supabase.co) e sgab.supabase.chave (secret/service_role)
# ficam no secrets.properties ou no .env (SGAB_SUPABASE_URL / SGAB_SUPABASE_CHAVE)
sgab.supabase.bucket-capas=capas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


