

spring.application.name=SGAB

spring.docker.compose.enabled=false

# Banco: Supabase (Postgres) quando DB_URL, DB_USERNAME e DB_PASSWORD estiverem definidos
# no secrets.properties ou como variáveis de ambiente (Docker: .env).
# Sem elas, cai no H2 em memória. O driver é escolhido automaticamente pela URL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:sgab;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# O plano gratuito do Supabase tem poucas conexões; cada backend rodando abre no máximo 3
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.config.import=optional:file:./secrets.properties
spring.jpa.defer-datasource-initialization=true

# spring.mail.host=127.0.0.1
# spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Capas dos livros: bucket público "capas" do Supabase Storage.
# sgab.supabase.url (https://<id-do-projeto>.supabase.co) e sgab.supabase.chave (secret/service_role)
# ficam no secrets.properties ou no .env (SGAB_SUPABASE_URL / SGAB_SUPABASE_CHAVE)
sgab.supabase.bucket-capas=capas
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


