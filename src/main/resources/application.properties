

spring.application.name=SGAB

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:sgab;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.config.import=optional:file:./secrets.properties
spring.jpa.defer-datasource-initialization=true

spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=meirelesheber37@protonmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Upload de imagens (capas dos livros), salvas em <projeto>/upload
sgab.upload.diretorio=upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


